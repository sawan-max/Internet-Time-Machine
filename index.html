    <!-- SPA Redirect Handler for GitHub Pages -->
    <!-- When 404.html redirects here with ?ghp_path=..., restore the original URL -->
    <script>
      (function () {
        var redirect = sessionStorage.getItem('ghp_redirect');
        if (redirect) {
          sessionStorage.removeItem('ghp_redirect');
          window.history.replaceState(null, '', redirect);
        }
      })();
    </script>
