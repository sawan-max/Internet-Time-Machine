<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internet Time Machine — Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect
    // When GitHub Pages returns a 404, this page saves the original path
    // and redirects to the app root. The index.html redirect handler then
    // restores the URL via history.replaceState so React Router can handle it.
    var basePath = '/Internet-Time-Machine';
    var fullPath = window.location.pathname;

    // Strip the base path prefix to get the client-side route
    var route = fullPath;
    if (fullPath.indexOf(basePath) === 0) {
      route = fullPath.slice(basePath.length) || '/';
    }

    // Store the full path (route + search + hash) for the redirect handler
    var redirectPath = basePath + route + window.location.search + window.location.hash;
    sessionStorage.setItem('ghp_redirect', redirectPath);

    // Redirect to the app root where index.html will pick it up
    window.location.replace(basePath + '/');
  </script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #07070d;
      color: #eeeef0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      max-width: 480px;
      padding: 40px 24px;
    }
    h1 { font-size: 48px; margin-bottom: 16px; }
    p { color: #6b7280; font-size: 16px; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-block;
      padding: 12px 28px;
      background: #38bdf8;
      color: #000;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    a:hover { background: #0ea5e9; }
  </style>
</head>
<body>
  <noscript>
    <div class="container">
      <h1>404</h1>
      <p>This page doesn't exist. It may have been moved, or the URL is incorrect.</p>
      <a href="/Internet-Time-Machine/">← Back to Home</a>
    </div>
  </noscript>
</body>
</html>
